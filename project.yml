name: HealthExport
options:
  bundleIdPrefix: com.jingyi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "8W29QFY8Z2"

targets:
  HealthExport:
    type: application
    platform: iOS
    sources:
      - path: HealthExport
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jingyi.healthexport
        INFOPLIST_FILE: HealthExport/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthExport/HealthExport.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
